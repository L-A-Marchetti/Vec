name: C tests
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        compiler: [gcc, clang]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: make CC=${{ matrix.compiler }} test test-example
      - run: make CC=${{ matrix.compiler }} sanitize
      - run: make CC=${{ matrix.compiler }} build/bench_vec
      - run: ./build/bench_vec 1000 2
